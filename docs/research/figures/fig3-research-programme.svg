<text x="590" y="460" font-size="13.5" fill="#1b2a4a" text-anchor="middle" font-weight="700">Figure 3. Three questions, one cumulative programme.</text>
<text x="590" y="480" font-size="11.5" fill="#5b6472" text-anchor="middle">Each question hands a defined product to the next; results from the last refine the first two.</text>
