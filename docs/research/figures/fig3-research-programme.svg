<text x="800" y="258" font-size="10.5" fill="#6b3fa0" text-anchor="start" font-weight="700">Primary evidence</text>
<text x="800" y="276" font-size="11" fill="#1f2430" text-anchor="start">safe reuse · failure modes · validity</text>
