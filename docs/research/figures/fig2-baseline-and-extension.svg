<text x="80" y="350" font-size="11" fill="#5b6472" text-anchor="start">compliance vectors · uncovered fragments · deviation patterns</text>
<text x="80" y="368" font-size="11" fill="#5b6472" text-anchor="start">confidence signals · review flags</text>
<text x="265" y="424" font-size="11.5" fill="#2f5aa8" text-anchor="middle" font-style="italic">The baseline detects and classifies variability.</text>
<text x="265" y="444" font-size="11.5" fill="#2f5aa8" text-anchor="middle" font-style="italic">It does not decide when to ask a person,</text>
<text x="265" y="464" font-size="11.5" fill="#2f5aa8" text-anchor="middle" font-style="italic">nor what to keep from the answer.</text>
<rect x="570" y="124" width="250" height="74" rx="8" ry="8" fill="#ffffff" stroke="#2f5aa8" stroke-width="1.6"/>
<text x="695.0" y="151.5" font-size="13" fill="#1b2a4a" text-anchor="middle" font-weight="700">RQ1 · Selective intervention</text>
<text x="695.0" y="170.5" font-size="11" fill="#5b6472" text-anchor="middle">when should the system ask?</text>
