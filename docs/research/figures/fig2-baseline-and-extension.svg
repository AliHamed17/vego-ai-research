<text x="695.0" y="282.5" font-size="11" fill="#5b6472" text-anchor="middle">represent · validate · store</text>
<rect x="870" y="236" width="250" height="74" rx="8" ry="8" fill="#ffffff" stroke="#c3cad8" stroke-width="1.4"/>
<text x="995.0" y="263.5" font-size="13" fill="#1b2a4a" text-anchor="middle" font-weight="700">Judgment memory</text>
<text x="995.0" y="282.5" font-size="11" fill="#5b6472" text-anchor="middle">scoped · contestable · revocable</text>
