<text x="845" y="465" font-size="11" fill="#8a5c05" text-anchor="middle">Safety invariant: reused judgment stays advisory unless an authorised change path is approved.</text>
<text x="590" y="540" font-size="13.5" fill="#1b2a4a" text-anchor="middle" font-weight="700">Figure 2. The baseline and the doctoral extension.</text>
<text x="590" y="560" font-size="11.5" fill="#5b6472" text-anchor="middle">The doctorate adds the decision of when to ask, what to preserve from the answer, and where a judgment may safely apply.</text>
