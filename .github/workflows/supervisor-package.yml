name: Unified runtime, BigUI, security, supervisor, and thesis checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.6"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  python-matrix:
    name: Python ${{ matrix.python }} complete inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install locked environment
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen --all-groups --python "${{ matrix.python }}"

      - name: Run every Python test group without deselection
        run: |
          uv run python -m pytest VEGO-AI/tests -q
          uv run python -m pytest scripts/tests -q
          uv run python -m pytest tests/hlayer_offline -q
          uv run python -m pytest tests/study1 -q

  source-security-and-documents:
    name: Source, security, browser, and documents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frozen toolchains
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen --all-groups
          npm ci --ignore-scripts --no-audit
          npx --no-install playwright install --with-deps chromium

      - name: Verify environment and compile imports
        run: |
          uv run python scripts/check_dependency_lock.py --check
          uv run python scripts/vego_doctor.py
          uv run python -m compileall -q VEGO-AI/framework VEGO-AI/eval VEGO-AI/analysis scripts src

      - name: Validate contracts, manifests, claims, citations, and freshness
        run: |
          uv run python scripts/validate_research_records.py schemas/examples
          uv run python scripts/validate_research_records.py \
            docs/research/bigui/experiment-catalog-snapshot-v1.json
          uv run python scripts/build_hardening_manifests.py --check
          uv run python scripts/build_bigui_architecture_snapshot.py --check
          uv run python scripts/run_bigui_comparison_experiments.py --check
          uv run python scripts/build_bigui_run_store.py --check
          uv run python scripts/build_experiment_benchmark.py --check
          uv run python scripts/build_bigui_catalog.py --check
          uv run python scripts/build_bigui.py --check
          uv run python scripts/run_bigui_architecture_experiments.py --check
          uv run python scripts/check_thesis_citations.py
          uv run python scripts/validate_thesis_content.py
          uv run python scripts/validate_thesis_evidence_package.py
          uv run python scripts/build_thesis_evidence_package.py --check
          uv run python scripts/build_thesis_progress_visual.py --check
          uv run python scripts/build_thesis_review_manifest.py --check
          uv run python visualizations-gallery/build_gallery.py --check
          uv run python scripts/visualization_agent.py --check
          uv run python scripts/check_repository_privacy.py
          uv run python scripts/check_evidence_consistency.py --check
          uv run python scripts/validate_study1_measurements.py \
            --input docs/research/phd-proposal/2026-09-03-supervisor-review-package/study1-preliminary-results.sanitized.json \
            --output "${RUNNER_TEMP}/study1-metric-validation.json"
          cmp \
            docs/research/phd-proposal/2026-09-03-supervisor-review-package/study1-metric-validation.sanitized.json \
            "${RUNNER_TEMP}/study1-metric-validation.json"

      - name: Validate deterministic thesis DOCX
        run: |
          uv run python scripts/validate_thesis_review_document.py \
            thesis/output/VEGO-AI-MSc-Thesis-Evidence-Ready-Draft-2026-07-25.docx
          mkdir -p "${RUNNER_TEMP}/thesis-a" "${RUNNER_TEMP}/thesis-b"
          uv run python scripts/build_thesis_review_document.py \
            --output "${RUNNER_TEMP}/thesis-a/review.docx"
          uv run python scripts/build_thesis_review_document.py \
            --output "${RUNNER_TEMP}/thesis-b/review.docx"
          uv run python scripts/validate_thesis_review_document.py \
            "${RUNNER_TEMP}/thesis-a/review.docx"
          test "$(sha256sum "${RUNNER_TEMP}/thesis-a/review.docx" | cut -d' ' -f1)" = \
               "$(sha256sum "${RUNNER_TEMP}/thesis-b/review.docx" | cut -d' ' -f1)"

      - name: Enforce reviewed protected-change and Study 1 release gates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          H_LAYER_AUTHORIZATION_SHA256: ${{ vars.H_LAYER_AUTHORIZATION_SHA256 }}
        run: |
          BASE="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-origin/main}}"
          if [[ "${BASE}" =~ ^0+$ ]]; then BASE="origin/main"; fi
          uv run python scripts/check_hlayer_change_authorization.py --base "${BASE}"
          uv run python scripts/validate_study1_release.py --base-ref "${BASE}"

      - name: Run security, dependency, privacy, and binary gates
        run: |
          uv run python scripts/check_quality_ratchet.py
          uv run python scripts/security_audit.py --history
          uv export --frozen --all-groups --no-hashes --quiet \
            --output-file "${RUNNER_TEMP}/requirements-audit.txt"
          uv run pip-audit -r "${RUNNER_TEMP}/requirements-audit.txt" \
            --progress-spinner off
          npm audit --audit-level=high

      - name: Exercise offline supervisor, thesis, and BigUI views
        run: |
          node scripts/tests/supervisor_package_browser_smoke.mjs
          node scripts/tests/thesis_progress_browser_smoke.mjs
          node scripts/tests/bigui_browser_smoke.mjs

      - name: Check diff and line-ending hygiene
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-HEAD^}}"
          if [[ "${BASE}" =~ ^0+$ ]]; then BASE="HEAD^"; fi
          git diff --check "${BASE}...HEAD"
          git diff --check
          test -z "$(git ls-files --eol '*.html' | grep -v 'i/lf' || true)"

  merge-gate:
    name: merge-gate
    if: always()
    needs: [python-matrix, source-security-and-documents]
    runs-on: ubuntu-latest
    steps:
      - name: Require all hardening jobs
        env:
          PYTHON_MATRIX: ${{ needs.python-matrix.result }}
          SOURCE_SECURITY: ${{ needs.source-security-and-documents.result }}
        run: |
          test "${PYTHON_MATRIX}" = "success"
          test "${SOURCE_SECURITY}" = "success"
