name: ACL Taxonomy v16 Validation

on:
  pull_request:
    paths:
      - ".github/workflows/acl-taxonomy-v16.yml"
      - "docs/research/phd-proposal/acl-2026-taxonomy-evidence-matrix-v16.csv"
      - "docs/research/phd-proposal/acl-2026-taxonomy-vego-ai-relevance-map-v16.md"
      - "docs/research/phd-proposal/acl-taxonomy-v16-strict-audit.md"
      - "docs/research/phd-proposal/acl-taxonomy-v16-strict-review-gate.md"
      - "docs/research/phd-proposal/acl-taxonomy-v16-supervisor-decision-record.md"
      - "docs/visualizations/vego-ai-acl-taxonomy-map-v16.mmd"
      - "docs/visualizations/vego-ai-acl-taxonomy-map-v16.svg"
      - "scripts/check_acl_taxonomy_v16.py"
      - "scripts/tests/test_check_acl_taxonomy_v16.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-validation:
    name: Structural validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile validator and tests
        run: >-
          python -m compileall -q
          scripts/check_acl_taxonomy_v16.py
          scripts/tests/test_check_acl_taxonomy_v16.py

      - name: Run targeted validator tests
        run: python -m pytest scripts/tests/test_check_acl_taxonomy_v16.py -q

      - name: Run fail-closed taxonomy validator
        run: >-
          python scripts/check_acl_taxonomy_v16.py
          --repo-root .
          --json reports/generated/acl_taxonomy_v16/structural-validation.json

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "${BASE_SHA}...HEAD"

      - name: Upload structural findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acl-taxonomy-v16-structural-findings
          path: reports/generated/acl_taxonomy_v16/structural-validation.json
          if-no-files-found: error
